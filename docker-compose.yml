services:
  db:
    image: postgres:latest
    container_name: forum_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: forum
    ports:
      - "5432:5432"
    networks:
      - internal_network
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    container_name: forum_api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - internal_network
      - public_network
    env_file:
      - ./api/.env

  thread:
    build: ./thread
    container_name: forum_thread
    ports:
      - "80:3000"
    depends_on:
      - api
    networks:
      - public_network

  sender:
    build: ./sender
    container_name: forum_sender
    ports:
      - "8080:3000"
    depends_on:
      - api
    networks:
      - public_network

networks:
  internal_network:
    driver: bridge
    internal: true
  public_network:
    driver: bridge

volumes:
  db_data:
